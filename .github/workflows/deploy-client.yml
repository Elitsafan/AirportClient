name: Deploy Frontend App to Azure Static Web Apps

on:
  push:
    branches:
      - master
    paths:
      - 'AirportClient/**'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'AirportClient/package-lock.json'

      - name: Install dependencies
        working-directory: ./AirportClient
        run: npm install

      - name: Run tests
        working-directory: ./AirportClient
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Inject production credentials
        working-directory: ./AirportClient
        env:
            ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/environment/environment.ts';
            let content = fs.readFileAsync(path, 'utf8');
            content = content
                .replace('username: \"\"', 'username: \"' + process.env.ADMIN_USERNAME + '\"')
                .replace('password: \"\"', 'password: \"' + process.env.ADMIN_PASSWORD + '\"');
            fs.writeFileSync(path, content);
            console.log('Credentials injected successfully.');"

      - name: Build Angular app
        working-directory: ./AirportClient
        run: npm run build

      - name: Copy staticwebapp.config.json
        run: |
          mkdir -p AirportClient/dist/airport-client
          cp AirportClient/staticwebapp.config.json AirportClient/dist/airport-client/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "AirportClient/dist/airport-client"
          output_location: ""
          skip_app_build: true
